[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminator-nfz"
version = "1.0.0"
description = "Powiadomienia na Telegram o wolnych terminach do lekarza z lekarzebezkolejki.pl"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
terminator-nfz = "terminator_nfz.cli:main"

[tool.setuptools]
packages = ["terminator_nfz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
