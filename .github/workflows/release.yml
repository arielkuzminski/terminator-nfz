name: release

# Buduje TerminatorNFZ.exe. Tag v* dołącza go do GitHub Release,
# ręczne uruchomienie (workflow_dispatch) zostawia go tylko jako artefakt do pobrania.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ".[dev,gui]" pyinstaller

      - run: python -m pytest -q

      - run: python packaging/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: TerminatorNFZ
          path: dist/TerminatorNFZ.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/TerminatorNFZ.exe --clobber
